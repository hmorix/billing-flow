name = "billingflow-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[vars]
PORT = "5000"
NODE_ENV = "production"
JWT_SECRET = "super_secret_billing_manager_key"
STRIPE_MOCK = "true"
STRIPE_SECRET_KEY = "sk_test_mock_stripe_secret_key"
STRIPE_WEBHOOK_SECRET = "whsec_mock_stripe_webhook_secret"
STRIPE_PRICE_GROWTH_ID = "price_mock_growth"
STRIPE_PRICE_ENTERPRISE_ID = "price_mock_enterprise"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "billingflow-logos"

[[d1_databases]]
binding = "DB"
database_name = "billing-db"
database_id = "d1-local-dev-id-mock-for-wrangler"
